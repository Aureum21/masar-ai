<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .mesh-line { fill: none; stroke: rgba(212, 178, 113, 0.045); stroke-width: 0.85; stroke-linecap: round; stroke-linejoin: round; }
      .mesh-accent { fill: none; stroke: rgba(212, 178, 113, 0.025); stroke-width: 0.6; }
    </style>
  </defs>
  <!-- Center Star -->
  <polygon class="mesh-line" points="40.0,20.0 43.17,32.35 54.14,25.86 47.65,36.83 60.0,40.0 47.65,43.17 54.14,54.14 43.17,47.65 40.0,60.0 36.83,47.65 25.86,54.14 32.35,43.17 20.0,40.0 32.35,36.83 25.86,25.86 36.83,32.35"/>
  <!-- Corner Stars -->
  <polygon class="mesh-line" points="0.0,-20.0 3.17,-7.65 14.14,-14.14 7.65,-3.17 20.0,-0.0 7.65,3.17 14.14,14.14 3.17,7.65 0.0,20.0 -3.17,7.65 -14.14,14.14 -7.65,3.17 -20.0,0.0 -7.65,-3.17 -14.14,-14.14 -3.17,-7.65"/>
  <polygon class="mesh-line" points="80.0,-20.0 83.17,-7.65 94.14,-14.14 87.65,-3.17 100.0,-0.0 87.65,3.17 94.14,14.14 83.17,7.65 80.0,20.0 76.83,7.65 65.86,14.14 72.35,3.17 60.0,0.0 72.35,-3.17 65.86,-14.14 76.83,-7.65"/>
  <polygon class="mesh-line" points="0.0,60.0 3.17,72.35 14.14,65.86 7.65,76.83 20.0,80.0 7.65,83.17 14.14,94.14 3.17,87.65 0.0,100.0 -3.17,87.65 -14.14,94.14 -7.65,83.17 -20.0,80.0 -7.65,76.83 -14.14,65.86 -3.17,72.35"/>
  <polygon class="mesh-line" points="80.0,60.0 83.17,72.35 94.14,65.86 87.65,76.83 100.0,80.0 87.65,83.17 94.14,94.14 83.17,87.65 80.0,100.0 76.83,87.65 65.86,94.14 72.35,83.17 60.0,80.0 72.35,76.83 65.86,65.86 76.83,72.35"/>
  <!-- Orthogonal Connectors -->
  <line class="mesh-line" x1="40" y1="0" x2="40" y2="20"/>
  <line class="mesh-line" x1="40" y1="60" x2="40" y2="80"/>
  <line class="mesh-line" x1="0" y1="40" x2="20" y2="40"/>
  <line class="mesh-line" x1="60" y1="40" x2="80" y2="40"/>
  <!-- Diagonal Connectors -->
  <line class="mesh-line" x1="14.14" y1="14.14" x2="25.86" y2="25.86"/>
  <line class="mesh-line" x1="65.86" y1="14.14" x2="54.14" y2="25.86"/>
  <line class="mesh-line" x1="14.14" y1="65.86" x2="25.86" y2="54.14"/>
  <line class="mesh-line" x1="65.86" y1="65.86" x2="54.14" y2="54.14"/>
  <!-- Central subtle rosette -->
  <circle class="mesh-accent" cx="40" cy="40" r="7"/>
  <circle class="mesh-accent" cx="0" cy="0" r="7"/>
  <circle class="mesh-accent" cx="80" cy="0" r="7"/>
  <circle class="mesh-accent" cx="0" cy="80" r="7"/>
  <circle class="mesh-accent" cx="80" cy="80" r="7"/>
</svg>